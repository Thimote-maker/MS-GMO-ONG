<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsable | GMO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body class="dashbody"><header class="dashhead"><a class="brand" href="index.html"><img src="assets/logo-gmo.jpg"><span>GMO<span>-ONG</span></span></a><a href="index.html">← Retour au site</a></header><main class="dash"><div class="dashintro"><div><small class="eyebrow dark">ESPACE RESPONSABLE</small><h1>Tableau de bord des activités</h1><p>Prototype frontend : les activités sont enregistrées dans le navigateur.</p></div><button class="btn primary" id="new">+ Nouvelle activité</button></div><div class="dashcards"><div><small>Activités</small><b id="count">0</b></div><div><small>Ce mois</small><b id="monthCount">0</b></div><div><small>À venir</small><b id="upcoming">0</b></div></div><div class="dashgrid"><section class="panel"><div class="paneltitle"><h2>Calendrier</h2><div><button id="prev">‹</button><b id="month"></b><button id="next">›</button></div></div><div id="calendar" class="calendar"></div></section><section class="panel"><div class="paneltitle"><h2>Activités</h2></div><div id="list"></div></section></div></main><div class="modal" id="modal"><div class="modalcard"><button class="x" id="close">×</button><h2 id="mtitle">Nouvelle activité</h2><form id="form"><input type="hidden" id="id"><label>Titre<input required id="title"></label><div class="formrow"><label>Date<input required type="date" id="date"></label><label>Heure<input required type="time" id="time"></label></div><label>Lieu<input required id="place"></label><label>Description<textarea required id="desc" rows="4"></textarea></label><label>Image (URL ou chemin
